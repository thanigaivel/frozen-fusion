# ── Netlify configuration for Frozen Fusion (Next.js static export) ──────────

[build]
  # Command Netlify runs to build the project
  command = "npm run build"
  # Override UI settings to publish the Next.js standard build output
  publish = ".next"

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache image-sequence frames aggressively (they never change)
[[headers]]
  for = "/fusion-icecream/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache logo and other static assets
[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
